[project]
name = "opti-abrechnung"
version = "0.1.0"
description = "Abrechnungstool Optionsraeume Spreefeld -- Auswertung und Controlling"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Axel Schmidt", email = "axel@schmidtlab.net" }]

dependencies = [
    "pandas>=2.2",
    "streamlit>=1.40",
    "altair>=5.4",
]

[project.optional-dependencies]
# Phase 2: Auswertung der Rechnungs-PDFs
rechnungen = ["pdfplumber>=0.11"]
# Phase 1, Schritt 6: PDF-Export des Quartalsberichts
bericht = ["weasyprint>=63.0", "jinja2>=3.1"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[project.scripts]
opti-abrechnung = "optiabrechnung.kommandozeile:hauptprogramm"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/optiabrechnung"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Fachbegriffe in der Oberflaeche sind bewusst lang und deutsch
"src/optiabrechnung/oberflaeche/*" = ["E501"]
